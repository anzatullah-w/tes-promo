<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Panel Kontrol Kamera (Laptop)</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    body { font-family: sans-serif; text-align: center; background: #222; color: white; padding: 20px; }
    video { width: 80%; max-width: 600px; border-radius: 10px; border: 2px solid #00ffcc; margin-top: 15px; }
    button { padding: 10px 20px; font-size: 16px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; }
  </style>
</head>
<body>
  <h2>Layar Pantau Kamera HP (Live)</h2>
  <button id="switchBtn">🔄 Ganti Kamera (Depan / Belakang)</button> <br>
  <video id="remoteVideo" autoplay playsinline muted></video>

  <script>
    const ID_LAPTOP = "guru-demo-kamera-123";
    const peer = new Peer(ID_LAPTOP);
    let activeDataConn = null;

    // Menangkap siaran video dari HP
    peer.on('call', (call) => {
      call.answer();
      call.on('stream', (remoteStream) => {
        document.getElementById('remoteVideo').srcObject = remoteStream;
      });
    });

    // Menangkap saluran data dari HP
    peer.on('connection', (conn) => {
      activeDataConn = conn;
    });

    // Tombol perintah ganti kamera
    document.getElementById('switchBtn').addEventListener('click', () => {
      if (activeDataConn && activeDataConn.open) {
        activeDataConn.send('switch');
      } else {
        alert("HP belum terhubung! Pastikan halaman web di HP sudah dibuka.");
      }
    });
  </script>
</body>
</html>
